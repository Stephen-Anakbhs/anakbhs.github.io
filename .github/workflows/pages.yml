name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  webkit-autoplay:
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install webkit
      - run: npm run build
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/autoplay-preview.log" 2>&1 &
          echo "PREVIEW_PID=$!" >> "$GITHUB_ENV"
          for attempt in {1..50}; do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 0.2
          done
          defaults write NSGlobalDomain NSAppSleepDisabled -bool YES
          caffeinate -d -i -u -t 600 &
          echo "AWAKE_PID=$!" >> "$GITHUB_ENV"
      - name: Verify Apple animation transparency
        env:
          ANIMATION_APP_ONLY: "1"
          ANIMATION_PROFILES: webkit
          ANIMATION_OUTPUT: output/verification/publication-animation
        run: node scripts/verify-publication-animation.mjs http://127.0.0.1:4173
      - name: Verify unactivated mobile video playback
        env:
          AUTOPLAY_ENGINES: webkit
        run: node scripts/verify-mobile-autoplay.mjs http://127.0.0.1:4173
      - name: Verify hero fallback playback
        continue-on-error: true
        env:
          AUTOPLAY_ENGINES: webkit
        run: node scripts/verify-hero-fallback.mjs http://127.0.0.1:4173
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webkit-autoplay
          path: output/verification/
      - name: Stop preview
        if: always()
        run: kill ${PREVIEW_PID:-} ${AWAKE_PID:-} 2>/dev/null || true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, webkit-autoplay]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
