name: Safari probe

on:
  push:
    branches:
      - probe/ios-safari
      - probe/ios-safari-old

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        runtime: ["26.2", "newest"]
        part: ["liftexp"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bash probe/run.sh ${{ matrix.runtime }} ${{ matrix.part }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-${{ matrix.runtime }}-${{ matrix.part }}
          path: output/probe/
